# Homebase production stack (runs on a Mac under OrbStack).
#
# Always run it through the wrapper so the repo-root .env is used for
# interpolation:   infra/scripts/compose.sh <command>
# (equivalent to:  docker compose --env-file .env -f infra/docker-compose.yml <command>)
#
# Network layout
#   backend (internal: no route to the internet, no published ports)
#       postgres, migrate, backup, worker, tailscale (+ web, which lives in
#       the tailscale container's network namespace)
#   egress (normal bridge, outbound internet only, nothing published)
#       tailscale (+ web), worker
#   demo (internal: no route to the internet)
#       demo-web, demo-postgres, demo-seed, and tailscale so cloudflared can
#       reach demo-web. The public demo never touches `backend`, the real
#       database, .env secrets or the internet.
#
# Nothing in this file publishes a port. There are two ways in, both proxies
# inside the shared netns dialing 127.0.0.2:3000:
#   - Tailscale Serve (tailnet only, Funnel disabled)
#   - cloudflared: an outbound-only Cloudflare Tunnel for the app's public hostname
#     (the app's own username + password sign-in) and the public demo's
#     (demo-web: a made-up household, no sign-in).
# Next.js listens on the dedicated loopback alias 127.0.0.2, not 127.0.0.1:
# tailscaled in userspace mode forwards raw tailnet TCP for any port to
# 127.0.0.1:<port>, which would bypass Serve (see docs/decisions.md, ADR
# "Security review fixes").

name: homebase

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-build: &app-build
  context: ..
  dockerfile: infra/docker/worker.Dockerfile

services:
  tailscale:
    image: tailscale/tailscale:v1.104.2
    hostname: ${TS_HOSTNAME:-homebase}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-homebase}
      TS_STATE_DIR: /var/lib/tailscale
      # Directory is mounted (not the file) so edits to serve.json are picked up.
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --advertise-tags=tag:homebase
      # Kernel networking (tailscale0 + netfilter in this netns). NOT userspace:
      # in userspace mode tailscaled's netstack forwards inbound tailnet TCP on
      # ANY port to 127.0.0.1:<port>, so a tailnet peer could skip Serve and talk
      # to the app (or the health endpoint) directly with forged identity
      # headers. In kernel mode a packet to 100.x:3000 is never delivered to a
      # socket bound to loopback. See docs/decisions.md, ADR "Security review
      # fixes" (supersedes "Tailscale sidecar runs in userspace mode").
      TS_USERSPACE: "false"
      # Only use the auth key when there is no saved node state.
      TS_AUTH_ONCE: "true"
      TS_ACCEPT_DNS: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      # Loopback only, so other containers on `backend` cannot reach it (the
      # image default is [::]:9002, every interface).
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
      TZ: America/New_York
    # Kernel mode needs the TUN device and NET_ADMIN (+ NET_RAW, as in
    # Tailscale's Docker guide) inside the OrbStack VM. No sysctls: this node
    # is not a subnet router or exit node, so it never forwards packets.
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    # web shares this container's network namespace and /etc/hosts, so the
    # host alias for whisper.cpp must be declared here (Docker rejects
    # extra_hosts on a network_mode: service:* container).
    extra_hosts:
      - "host.internal:host-gateway"
    networks:
      - backend
      - egress
      - demo
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    image: homebase-web:local
    network_mode: service:tailscale
    env_file: ../.env
    environment:
      # Docker sets HOSTNAME to the container name by default; Next.js
      # standalone binds to $HOSTNAME, so pin it to the dedicated loopback
      # alias 127.0.0.2 (Linux routes all of 127.0.0.0/8 to lo, so no setup is
      # needed). tailscaled never dials it on its own; only Serve's proxy does
      # (infra/tailscale/serve.json). Header trust requires HOSTNAME to equal
      # HOMEBASE_LISTEN_HOST (src/server/identity/header-trust.ts).
      HOSTNAME: 127.0.0.2
      HOMEBASE_LISTEN_HOST: 127.0.0.2
      # Identify users by the Tailscale-User-Login header that Serve injects.
      HOMEBASE_TRUST_TAILSCALE_HEADERS: "1"
      # Cloudflare Access (optional) reads HOMEBASE_CF_ACCESS_TEAM and
      # HOMEBASE_CF_ACCESS_AUD from .env (off unless both are set).
      # "Try the demo" link on the sign-in page.
      HOMEBASE_DEMO_URL: https://budget-demo.ridgelineva.com
      PORT: "3000"
      NODE_ENV: production
      TZ: America/New_York
    depends_on:
      tailscale:
        condition: service_started
        # Re-create web's netns attachment whenever tailscale restarts.
        restart: true
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Read-only: Settings → Backups lists and downloads the nightly dumps.
      - ../backups:/backups:ro
    restart: unless-stopped
    logging: *logging

  cloudflared:
    # Remotely managed tunnel "homebase"; the public hostnames are set in the
    # Cloudflare dashboard: the app's hostname -> http://127.0.0.2:3000 and
    # the demo's -> http://demo-web:3000. Outbound only. Shares
    # the tailscale netns to reach the app (and the `demo` network).
    image: cloudflare/cloudflared:2026.5.0
    command: ["tunnel", "--no-autoupdate", "run"]
    network_mode: service:tailscale
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      tailscale:
        condition: service_started
        restart: true
    restart: unless-stopped
    logging: *logging

  worker:
    build: *app-build
    image: homebase-worker:local
    env_file: ../.env
    environment:
      NODE_ENV: production
      TZ: America/New_York
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.internal:host-gateway"
    volumes:
      # Read-only: lets the backup.pgdump job check freshness of the nightly dump.
      - ../backups:/backups:ro
    networks:
      - backend
      - egress
    restart: unless-stopped
    logging: *logging

  migrate:
    # Same image as the worker (full workspace + tsx); one-shot.
    build: *app-build
    image: homebase-worker:local
    command: ["pnpm", "db:migrate"]
    env_file: ../.env
    environment:
      NODE_ENV: production
      TZ: America/New_York
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"
    logging: *logging

  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: homebase
      POSTGRES_DB: homebase
      # Only applied when the pgdata volume is first initialised.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (run infra/scripts/server-bootstrap.sh)}
      TZ: America/New_York
      PGTZ: America/New_York
    volumes:
      # Postgres 18 images keep PGDATA at /var/lib/postgresql/18/docker and
      # declare the volume at /var/lib/postgresql (not .../data).
      - pgdata:/var/lib/postgresql
    networks:
      - backend
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U homebase -d homebase"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *logging

  backup:
    # Same major version as the server so pg_dump/pg_restore match.
    image: postgres:18.6-bookworm
    entrypoint: ["/bin/bash", "/backup/pgdump.sh"]
    command: ["loop"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: homebase
      PGDATABASE: homebase
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      TZ: America/New_York
      BACKUP_DIR: /backups
      BACKUP_AT: "03:30"
      RETENTION_DAYS: "30"
    volumes:
      - ./backup:/backup:ro
      - ../backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

  # ── Public demo (budget-demo.ridgelineva.com) ────────────────────────────
  # A made-up household on its own Postgres. No env_file: these containers get
  # none of the real secrets, only a demo-only DB password and master key.
  demo-postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: homebase
      POSTGRES_DB: homebase
      POSTGRES_PASSWORD: ${DEMO_POSTGRES_PASSWORD:?DEMO_POSTGRES_PASSWORD must be set in .env}
      TZ: America/New_York
      PGTZ: America/New_York
    volumes:
      - demo-pgdata:/var/lib/postgresql
    networks:
      - demo
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U homebase -d homebase"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  demo-seed:
    # Migrates, then rebuilds the sample data (ending today, made-up names)
    # now and every night at 4:00, which also wipes whatever visitors changed.
    # seed:demo refuses to wipe a database that holds non-demo data.
    image: homebase-worker:local
    command:
      - sh
      - -c
      - >-
        pnpm db:migrate &&
        while true; do
        pnpm seed:demo --public;
        sleep $$(node -e 'const n=new Date(),t=new Date(n);t.setHours(4,0,0,0);if(t<=n)t.setDate(t.getDate()+1);console.log(Math.round((t-n)/1000))');
        done
    environment:
      NODE_ENV: production
      TZ: America/New_York
      DATABASE_URL: postgres://homebase:${DEMO_POSTGRES_PASSWORD}@demo-postgres:5432/homebase
      HOMEBASE_MASTER_KEY: ${DEMO_MASTER_KEY:?DEMO_MASTER_KEY must be set in .env}
    depends_on:
      demo-postgres:
        condition: service_healthy
    networks:
      - demo
    mem_limit: 768m
    healthcheck:
      disable: true
    restart: unless-stopped
    logging: *logging

  demo-web:
    image: homebase-web:local
    environment:
      HOMEBASE_DEMO: "1"
      # Reached only by cloudflared over the internal `demo` network.
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
      TZ: America/New_York
      DATABASE_URL: postgres://homebase:${DEMO_POSTGRES_PASSWORD}@demo-postgres:5432/homebase
      HOMEBASE_MASTER_KEY: ${DEMO_MASTER_KEY}
    depends_on:
      demo-postgres:
        condition: service_healthy
      demo-seed:
        condition: service_started
    networks:
      - demo
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

networks:
  backend:
    internal: true
  egress: {}
  demo:
    internal: true

volumes:
  pgdata: {}
  demo-pgdata: {}
  tailscale-state: {}
